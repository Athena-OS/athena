title   Athena OS install medium (x86_64, UEFI, NVIDIA, nouveau disabled)
sort-key 03
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-aegis-offensive
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-aegis-offensive.img
options  archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G copytoram=n module_blacklist=nouveau radeon.modeset=1 i915.modeset=1 nvme_load=yes loglevel=2
