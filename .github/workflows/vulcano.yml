name: Vulcano
on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, edited, synchronize, ready_for_review]
    paths:
      - 'src/**/PKGBUILD'
permissions:
  contents: read
  pull-requests: write
jobs:
  labeling:
    # remove/* PRs (remove-packages workflow) only delete PKGBUILDs: nothing to check
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'remove/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Labeling
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: '1.has: package'
  pkgcheck:
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'remove/') }}
    runs-on: ubuntu-latest
    container:
      image: athenaos/base-devel:latest
      options: --privileged
    steps:
      - name: Install dependencies
        run: |
          pacman -Syyu --noconfirm pkgcheck-arch git
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Trust workspace directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check Styling
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # whole PR (base..head), not only the last commit; deleted files excluded
          mapfile -t CHANGED_PKGBUILDS < <(git diff --name-only --diff-filter=ACMRT \
            "$BASE_SHA" "$HEAD_SHA" | grep 'src/.*/PKGBUILD$' || true)
          rc=0
          for FILE in "${CHANGED_PKGBUILDS[@]}"; do
            [[ -n "$FILE" ]] || continue
            echo "Checking $FILE..."
            pkgcheck "$FILE" || rc=1
          done
          exit $rc
  validate:
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'remove/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Build Package
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # NOTE: It can validate also Athena private repos but only for -git packages, not for private tarball sources (i.e., https://github.com/Athena-OS/something/archive/v1.0.tar.gz)
          set -euo pipefail
          printf '%s' "$GH_TOKEN" > /tmp/ghtoken
          chmod 0644 /tmp/ghtoken

          mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACMRT \
            "$BASE_SHA" "$HEAD_SHA" | grep 'src/.*/PKGBUILD$' || true)

          for FILE in "${CHANGED[@]}"; do
            [[ -n "$FILE" ]] || continue
            podman build --build-arg PKGDIR="$(dirname "$FILE")" \
              -t builder -f vulcano/Dockerfile .
            podman run --rm -v /tmp/ghtoken:/run/secrets/ghtoken:ro builder
          done

          shred -u /tmp/ghtoken
