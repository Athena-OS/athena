# Remove packages: give one or more package directory names; the run deletes
# their sources on a branch and opens ONE pull request. Merging that PR removes
# the packages from the package repository too (auto-update-release.yml).
name: Remove packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Package directory names to remove (space separated)'
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed --noprogressbar git jq python github-cli

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.BOT_TOKEN || github.token }}

      - name: Read the package tree
        run: |
          bash .github/ci/pkgtree.sh src .ci-state/pkgtree
          mkdir -p .ci-state/state && mkdir -p lists && touch lists/to-remove
          bash .github/ci/meta-all.sh .ci-state/pkgtree .ci-state/meta.txt
          python3 .github/ci/detect.py scan --meta .ci-state/meta.txt --out .ci-state/state \
            --packages .ci-state/pkgtree --exclude .github/ci/exclude.txt --exclude lists/to-remove \
            --overrides .github/ci/nvchecker-overrides.toml >/dev/null

      - name: Open the removal PR
        env:
          PACKAGES: ${{ inputs.packages }}
          BASE_BRANCH: main
          PKGMAP: .ci-state/pkgtree.map
          META: .ci-state/state/meta.json
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_USER_NAME: athena-ci[bot]
          GIT_USER_EMAIL: info@athenaos.org
        run: bash .github/ci/remove-prepare.sh .ci-state/pkgtree "$PACKAGES"
